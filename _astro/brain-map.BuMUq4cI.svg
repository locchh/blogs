<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="16" fill="#ffffff" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#23272E">Three memory systems, three places to put the thinking</text>
  <text x="40" y="72" font-size="14" fill="#5C6470">The brain already solved it: fast capture, slow general store, and a sleep job that moves one into the other.</text>

  <!-- ===== BRAIN ===== -->
  <g>
    <!-- cerebellum -->
    <circle cx="410" cy="352" r="40" fill="#E7E9EE" stroke="#AEB4BF" stroke-width="2"/>
    <path d="M 380,338 q 12,10 0,28 M 396,330 q 14,12 0,34 M 414,330 q 14,12 0,32 M 432,338 q 10,10 0,26" fill="none" stroke="#AEB4BF" stroke-width="1.5"/>
    <!-- brainstem -->
    <path d="M 392,388 q -6,34 -22,46 q 20,6 34,-8 q 8,-20 8,-40 z" fill="#E7E9EE" stroke="#AEB4BF" stroke-width="2"/>

    <!-- neocortex (whole cerebrum) -->
    <path d="M 70,285 C 60,180 150,120 255,120 C 350,120 448,165 448,258 C 448,320 420,360 360,372 C 300,384 205,388 150,368 C 105,352 78,330 70,285 Z"
          fill="#DCE7F5" stroke="#4A6FA5" stroke-width="2.5"/>
    <!-- gyri -->
    <path d="M 120,158 C 170,140 235,138 300,150 M 150,180 C 210,166 280,166 350,182 M 320,140 C 360,150 400,175 420,210"
          fill="none" stroke="#9DB4D6" stroke-width="1.6" stroke-linecap="round"/>

    <!-- prefrontal patch (a region INSIDE the neocortex) -->
    <path d="M 74,286 C 66,196 120,140 206,134 C 214,182 214,330 205,360 C 150,366 104,352 82,322 C 75,310 73,300 74,286 Z"
          fill="#F6D9A8" stroke="#C6892E" stroke-width="2" opacity="0.92"/>

    <!-- hippocampus: internal, shown via dashed cutaway ring -->
    <ellipse cx="262" cy="306" rx="52" ry="38" fill="none" stroke="#8A93A2" stroke-width="1.4" stroke-dasharray="4 4"/>
    <path d="M 248,286 c 24,-9 44,11 37,37 c -6,22 -33,28 -48,13 c 11,9 31,4 33,-14 c 2,-18 -16,-28 -26,-22 z"
          fill="#BFE6D2" stroke="#2E8B63" stroke-width="2.2"/>

    <!-- sleep arrow: hippocampus -> cortex -->
    <path d="M 250,292 C 210,250 190,205 196,178" fill="none" stroke="#2E8B63" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
    <text x="120" y="238" font-size="12.5" font-weight="600" fill="#2E8B63" transform="rotate(-42 120 238)">sleep → consolidation</text>

    <!-- callout labels -->
    <text x="70" y="104" font-size="14" font-weight="700" fill="#C6892E">Prefrontal cortex</text>
    <line x1="120" y1="112" x2="150" y2="200" stroke="#C6892E" stroke-width="1.2"/>
    <text x="300" y="104" font-size="14" font-weight="700" fill="#4A6FA5">Neocortex — the whole sheet</text>
    <line x1="360" y1="112" x2="360" y2="150" stroke="#4A6FA5" stroke-width="1.2"/>
    <text x="222" y="470" font-size="14" font-weight="700" fill="#2E8B63">Hippocampus</text>
    <line x1="262" y1="458" x2="262" y2="344" stroke="#2E8B63" stroke-width="1.2"/>
    <text x="120" y="490" font-size="12" fill="#5C6470">(prefrontal is a region of the neocortex; the hippocampus is not)</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g>
    <rect x="512" y="96" width="356" height="386" rx="12" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="534" y="130" font-size="15" font-weight="700" fill="#23272E">Brain → knowledge base</text>

    <!-- row: prefrontal -->
    <rect x="534" y="150" width="18" height="18" rx="4" fill="#F6D9A8" stroke="#C6892E" stroke-width="1.5"/>
    <text x="562" y="164" font-size="14" font-weight="700" fill="#23272E">Prefrontal cortex</text>
    <text x="562" y="184" font-size="12.5" fill="#5C6470">working memory · held as activity</text>
    <text x="562" y="202" font-size="12.5" fill="#3A6DB0">→ the context window (per-query, discarded)</text>

    <!-- row: hippocampus -->
    <rect x="534" y="228" width="18" height="18" rx="4" fill="#BFE6D2" stroke="#2E8B63" stroke-width="1.5"/>
    <text x="562" y="242" font-size="14" font-weight="700" fill="#23272E">Hippocampus</text>
    <text x="562" y="262" font-size="12.5" fill="#5C6470">fast capture · recent, specific</text>
    <text x="562" y="280" font-size="12.5" fill="#3A6DB0">→ write-time (raw facts + provenance)</text>

    <!-- row: neocortex -->
    <rect x="534" y="306" width="18" height="18" rx="4" fill="#DCE7F5" stroke="#4A6FA5" stroke-width="1.5"/>
    <text x="562" y="320" font-size="14" font-weight="700" fill="#23272E">Neocortex</text>
    <text x="562" y="340" font-size="12.5" fill="#5C6470">long-term store · slow, generalized</text>
    <text x="562" y="358" font-size="12.5" fill="#3A6DB0">→ consolidated, distilled knowledge</text>

    <!-- row: sleep -->
    <line x1="535" y1="392" x2="551" y2="392" stroke="#2E8B63" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
    <text x="562" y="392" font-size="14" font-weight="700" fill="#23272E">Sleep</text>
    <text x="562" y="412" font-size="12.5" fill="#5C6470">replay → consolidation</text>
    <text x="562" y="430" font-size="12.5" fill="#3A6DB0">→ the background sleep job (prune, distill)</text>

    <text x="534" y="462" font-size="11.5" fill="#8A93A2">Mapping is by mechanism (activity vs. structure), not tidy anatomy.</text>
  </g>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E8B63"/>
    </marker>
  </defs>
</svg>
